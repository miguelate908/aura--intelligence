# Blueprint de Render: crea el servicio web y la base PostgreSQL.
# Guía paso a paso: docs/DESPLIEGUE.md
services:
  - type: web
    name: aura-intelligence
    runtime: python
    plan: starter            # el plan gratuito se duerme y tarda en despertar: malo para demos
    region: virginia       # la más cercana a Colombia
    # Sin rootDir: los comandos parten de la raíz del repositorio. Así el build ve frontend/
    # y cualquier cambio (frontend o backend) dispara el despliegue automático.
    # El build compila React en backend/static (vite.config.ts); esa carpeta no se guarda en git.
    buildCommand: >-
      node --version && npm --version &&
      cd frontend && npm ci --include=dev && npm run build && cd .. &&
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true         # despliega en cada cambio fusionado en la rama configurada
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION    # Node que usa el build del frontend (Vite 6 + TypeScript 5; plugin-react 5 exige >=22.12)
        value: 22.22.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REGISTRATION_ENABLED
        value: "false"       # las cuentas de clientes se crean con scripts/create_client.py
      - key: ADMIN_EMAILS
        sync: false          # Render la pide al crear el servicio
      - key: DEMO_REQUEST_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"

databases:
  - name: aura-db
    plan: basic-256mb        # incluye copias de seguridad; el plan gratuito caduca
    region: virginia       # la más cercana a Colombia
    databaseName: aura
    user: aura
