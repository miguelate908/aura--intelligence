name: JWT and tenant isolation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  auth-tests:
    name: JWT and tenant isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: "public-test-only-key-for-in-memory-auth-tests"
      REGISTRATION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run authentication tests
        run: python -m pytest -v tests/test_jwt_tokens.py tests/test_auth_tenant_isolation.py
